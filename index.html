<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作挑战卡片生成器 - Challenge Card Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Custom Theme Variable Mappings */
    :root {
      --card-bg: #f7f6f2;
      --item-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-sub: #8c7b75;
      --border-color: #e2dfd8;
      --accent-glow: rgba(140, 123, 117, 0.15);
      --font-title: 'Noto Serif SC', serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .theme-dark {
      --card-bg: #18181b;
      --item-bg: #27272a;
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --border-color: #3f3f46;
      --accent-glow: rgba(161, 161, 170, 0.15);
    }

    .theme-paper {
      --card-bg: #faf8f5;
      --item-bg: #f2efe9;
      --text-main: #3d3b38;
      --text-sub: #787267;
      --border-color: #e0dacd;
      --accent-glow: rgba(120, 114, 103, 0.15);
    }

    .theme-mint {
      --card-bg: #f0f4f3;
      --item-bg: #ffffff;
      --text-main: #223330;
      --text-sub: #5a8078;
      --border-color: #d5e0dc;
      --accent-glow: rgba(90, 128, 120, 0.15);
    }

    .theme-cyber {
      --card-bg: #0d0f18;
      --item-bg: #16192b;
      --text-main: #00ffcc;
      --text-sub: #ff007f;
      --border-color: #2a2f4c;
      --accent-glow: rgba(0, 255, 204, 0.2);
    }

    body {
      font-family: var(--font-body);
    }

    .font-serif-custom {
      font-family: var(--font-title);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-slate-200">

  <header class="w-full bg-white/80 backdrop-blur border-b border-slate-200 px-6 py-4 sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md">
        ✨
      </div>
      <div>
        <h1 class="font-bold text-slate-900 leading-none text-base">创作挑战卡片生成器</h1>
        <p class="text-xs text-slate-500 mt-1">Vibe Challenge Card Studio</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="exportCardImage()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm hover:shadow transition-all flex items-center gap-2 active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>下载高精卡片 (PNG)</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- Left Column: Interactive Control Panel -->
    <section class="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
      
      <div class="border-b border-slate-100 pb-4">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <span>⚙️</span> 参数与设计配置
        </h2>
        <p class="text-xs text-slate-500 mt-1">实时调整文字与外观，卡片将同步呈现</p>
      </div>

      <!-- Title, Subtitle, and Footer Credit inputs -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">主标题</label>
          <input id="cfg-title" type="text" value="7天文画双修创作挑战" 
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">副标题</label>
            <input id="cfg-subtitle" type="text" value="探索作者性与大众性的平衡" 
              class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">制表落款</label>
            <input id="cfg-author" type="text" value="制表 / @九隐" 
              class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800">
          </div>
        </div>
      </div>

      <!-- Layout & Days Controls -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">挑战天数</label>
          <input id="cfg-days-count" type="number" min="1" max="30" value="7" 
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">每行列数</label>
          <select id="cfg-cols" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800 bg-white">
            <option value="2" selected>2 列</option>
            <option value="3">3 列</option>
            <option value="4">4 列</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">主题风格</label>
          <select id="cfg-theme" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm text-slate-800 bg-white">
            <option value="warm" selected>暖沙复古</option>
            <option value="dark">暗黑哥特</option>
            <option value="paper">极简宣纸</option>
            <option value="mint">冷调清霜</option>
            <option value="cyber">千禧朋克</option>
          </select>
        </div>
      </div>

      <!-- Quick Preset Prompt Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">预设模板加载</label>
        <div class="flex flex-wrap gap-2">
          <button onclick="loadPreset('combo7')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-md transition font-medium">7天文画双修</button>
          <button onclick="loadPreset('be7')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-md transition font-medium">7天意象BE</button>
          <button onclick="loadPreset('oc30')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-md transition font-medium">12天OC精选</button>
        </div>
      </div>

      <!-- Multiline Textarea Input for Daily Prompts -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">每日题目列表 (每行一天)</label>
          <span class="text-[10px] text-slate-400">支持 "Day1: 题目" 格式</span>
        </div>
        <textarea id="cfg-days-text" rows="9" 
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-xs leading-relaxed font-mono text-slate-700 resize-y">Day 1: 经典世界观 Paro（身份与气场）
Day 2: 命运岔路 If 线（选择与代价）
Day 3: 核心意象与氛围（自然与情绪）
Day 4: 局部镜头特写（细节与留白）
Day 5: 无声的张力对戏（潜台词与暗流）
Day 6: 异色与反差侧面（隐藏的悖论）
Day 7: 完全自由的摸鱼（本能与风格）</textarea>
      </div>

      <div class="pt-2">
        <button onclick="exportCardImage()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm shadow-sm transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          生成并保存高精 PNG 图片
        </button>
      </div>
    </section>

    <!-- Right Column: Card Preview Canvas Box -->
    <section class="lg:col-span-7 flex flex-col items-center justify-start w-full">
      
      <div class="w-full flex items-center justify-between mb-3 text-xs text-slate-500 px-1">
        <span>👁️ 实时渲染预览 (100% 还原导出尺寸)</span>
        <span id="card-resolution-indicator">渲染宽度: 520px</span>
      </div>

      <!-- Preview Card Wrapper -->
      <div class="p-4 bg-slate-200/60 rounded-2xl border border-slate-300/50 w-full flex justify-center overflow-x-auto">
        
        <!-- Target Export Element -->
        <div id="render-card-node" class="w-[520px] transition-all duration-300 p-8 flex flex-col justify-between gap-6 shadow-2xl rounded-xl"
             style="background-color: var(--card-bg); color: var(--text-main);">
          
          <!-- Card Header Section -->
          <header class="text-center space-y-2">
            <h2 id="card-title-node" class="text-2xl font-bold font-serif-custom tracking-wide">7天文画双修创作挑战</h2>
            <div id="card-subtitle-node" class="text-xs tracking-wider opacity-80 uppercase" style="color: var(--text-sub);">探索作者性与大众性的平衡</div>
          </header>

          <!-- Dynamic Grid Layout -->
          <div id="card-grid-node" class="grid gap-3 my-2">
            <!-- Grid Items Injected By JS -->
          </div>

          <!-- Card Footer Watermark Section -->
          <footer class="pt-3 border-t flex justify-between items-center text-[11px]" style="border-color: var(--border-color); color: var(--text-sub);">
            <span class="tracking-widest uppercase">CHALLENGE ACCEPTED</span>
            <span id="card-author-node">制表 / @九隐</span>
          </footer>

        </div>
      </div>
    </section>

  </main>

  <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-200/80 bg-white/50">
    Vibe Challenge Card Studio &copy; 本地即时渲染导出 · 无网络依赖
  </footer>

  <script>
    // Preset Data Store
    const presets = {
      combo7: {
        title: "7天文画双修创作挑战",
        subtitle: "探索作者性与大众性的平衡",
        author: "制表 / @九隐",
        daysCount: 7,
        cols: "2",
        text: `Day 1: 经典世界观 Paro（身份与气场）\nDay 2: 命运岔路 If 线（选择与代价）\nDay 3: 核心意象与氛围（自然与情绪）\nDay 4: 局部镜头特写（细节与留白）\nDay 5: 无声的张力对戏（潜台词与暗流）\nDay 6: 异色与反差侧面（隐藏的悖论）\nDay 7: 完全自由的摸鱼（本能与风格）`
      },
      be7: {
        title: "7天同人BE意象挑战",
        subtitle: "情绪递进与氛围沉浸练习",
        author: "制表 / @同人创作组",
        daysCount: 7,
        cols: "2",
        text: `Day 1: 悬日（悬日是落日却悬在眼前）\nDay 2: 蝉噪（夏日蝉鸣喧嚣之下藏着不安）\nDay 3: 礁石（海浪之下坚硬的礁石终将显露）\nDay 4: 雨夜（雨水能冲刷痕迹也能放大孤独）\nDay 5: 裂隙（裂痕已经无法弥补如同鸿沟）\nDay 6: 倒计时（结局近在眼前钟摆敲响）\nDay 7: 余烬（大火烧尽只剩冰冷的灰烬）`
      },
      oc30: {
        title: "12天OC核心质感挑战",
        subtitle: "角色多维塑造与视角拓展",
        author: "制表 / @OC同好会",
        daysCount: 12,
        cols: "3",
        text: `Day 1: 幼年时期的模样\nDay 2: 迟暮之年的模样\nDay 3: 背面与侧面全貌\nDay 4: 身上最特别的特写\nDay 5: 另一条选择线上的Ta\nDay 6: 不为人知的另一面\nDay 7: 经典学院/校服Paro\nDay 8: 乐队宇宙中的担当\nDay 9: 穿上华丽礼服特写\nDay 10: 运动/锻炼身体状态\nDay 11: 极其阳光的一句台词\nDay 12: 用全新风格创作一次`
      }
    };

    // DOM References
    const elTitle = document.getElementById('cfg-title');
    const elSubtitle = document.getElementById('cfg-subtitle');
    const elAuthor = document.getElementById('cfg-author');
    const elDaysCount = document.getElementById('cfg-days-count');
    const elCols = document.getElementById('cfg-cols');
    const elTheme = document.getElementById('cfg-theme');
    const elDaysText = document.getElementById('cfg-days-text');

    const cardNode = document.getElementById('render-card-node');
    const cardTitle = document.getElementById('card-title-node');
    const cardSubtitle = document.getElementById('card-subtitle-node');
    const cardAuthor = document.getElementById('card-author-node');
    const cardGrid = document.getElementById('card-grid-node');

    function syncCardState() {
      // 1. Update text fields including custom author/footer credit
      cardTitle.innerText = elTitle.value.trim() || "创作挑战";
      cardSubtitle.innerText = elSubtitle.value.trim() || "CHALLENGE CARD";
      cardAuthor.innerText = elAuthor.value.trim() || "";

      // 2. Update Theme Class
      const selectedTheme = elTheme.value;
      cardNode.className = `w-[520px] transition-all duration-300 p-8 flex flex-col justify-between gap-6 shadow-2xl rounded-xl theme-${selectedTheme}`;

      // 3. Render Dynamic Grid
      renderGrid();
    }

    function renderGrid() {
      const targetCount = parseInt(elDaysCount.value) || 7;
      const cols = parseInt(elCols.value) || 2;
      const rawLines = elDaysText.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      cardGrid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      cardGrid.innerHTML = '';

      for (let i = 0; i < targetCount; i++) {
        const rawLine = rawLines[i] || `Day ${i + 1}: 待定制题目`;
        
        let dayLabel = `DAY ${i + 1}`;
        let dayDetail = rawLine;

        if (rawLine.includes(':') || rawLine.includes('：')) {
          const splitArr = rawLine.split(/[:：]/);
          dayLabel = splitArr[0].trim();
          dayDetail = splitArr.slice(1).join('：').trim();
        }

        const itemNode = document.createElement('div');
        itemNode.className = "p-3 rounded-lg border transition-all flex flex-col justify-between gap-1 text-xs";
        itemNode.style.backgroundColor = "var(--item-bg)";
        itemNode.style.borderColor = "var(--border-color)";

        if (i === targetCount - 1 && targetCount % cols !== 0) {
          const remainder = targetCount % cols;
          const spanWidth = cols - remainder + 1;
          itemNode.style.gridColumn = `span ${spanWidth} / span ${spanWidth}`;
        }

        itemNode.innerHTML = `
          <div class="font-bold tracking-wider uppercase text-[10px] pb-1 border-b" style="color: var(--text-sub); border-color: var(--border-color);">
            ${dayLabel}
          </div>
          <div class="mt-1 font-medium leading-relaxed" style="color: var(--text-main);">
            ${dayDetail}
          </div>
        `;

        cardGrid.appendChild(itemNode);
      }
    }

    // Preset Loader
    function loadPreset(key) {
      const p = presets[key];
      if (!p) return;
      elTitle.value = p.title;
      elSubtitle.value = p.subtitle;
      if (p.author) elAuthor.value = p.author;
      elDaysCount.value = p.daysCount;
      elCols.value = p.cols;
      elDaysText.value = p.text;
      syncCardState();
    }

    function exportCardImage() {
      html2canvas(cardNode, {
        scale: 2.5,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        const count = elDaysCount.value;
        const filename = `${cardTitle.innerText}_${count}天挑战卡片.png`;
        link.download = filename;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
      }).catch(err => {
        alert("图片导出失败，请重试: " + err);
      });
    }

    // Attach Event Listeners
    [elTitle, elSubtitle, elAuthor, elDaysCount, elCols, elTheme, elDaysText].forEach(element => {
      element.addEventListener('input', syncCardState);
      element.addEventListener('change', syncCardState);
    });

    // Initial Engine Bootstrap
    window.onload = function() {
      syncCardState();
    };
  </script>
</body>
</html>
