<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>创作挑战卡片生成器</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root { --bg: #f7f6f2; --item: #fff; --text: #2b2b2b; --sub: #8c7b75; --border: #e2dfd8; }
    .theme-dark { --bg: #18181b; --item: #27272a; --text: #f4f4f5; --sub: #a1a1aa; --border: #3f3f46; }
    .theme-paper { --bg: #faf8f5; --item: #f2efe9; --text: #3d3b38; --sub: #787267; --border: #e0dacd; }
    .theme-mint { --bg: #f0f4f3; --item: #ffffff; --text: #223330; --sub: #5a8078; --border: #d5e0dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f1f5f9; color: #334155; padding: 20px; display: flex; gap: 20px; justify-content: center; }
    .panel { width: 380px; background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; flex-col; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 600; color: #64748b; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
    .row { display: flex; gap: 8px; }
    .btn { padding: 8px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #4f46e5; color: #fff; width: 100%; }
    .btn-sub { background: #e0e7ff; color: #4338ca; width: 100%; }
    .day-item { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .day-tag { font-size: 12px; font-weight: bold; width: 45px; color: #64748b; text-align: right; }
    .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 0 4px; }
    #days-box { max-height: 220px; overflow-y: auto; padding-right: 4px; }
    
    /* 预览区卡片 */
    #card { width: 480px; background: var(--bg); color: var(--text); border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .card-head { text-align: center; }
    .card-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--sub); }
    .card-grid { display: grid; gap: 10px; }
    .card-item { background: var(--item); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 12px; }
    .card-item-tag { font-weight: bold; font-size: 10px; color: var(--sub); margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
    .card-foot { font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; border-top: 1px solid var(--border); pt: 8px; margin-top: 10px; }
  </style>
  <style id="custom-css"></style>
</head>
<body>

  <!-- 控制面板 -->
  <div class="panel">
    <div class="form-group"><label>主标题</label><input id="title" value="7天文画双修创作挑战"></div>
    <div class="row">
      <div class="form-group" style="flex:1"><label>副标题</label><input id="subtitle" value="探索作者性与大众性的平衡"></div>
      <div class="form-group" style="flex:1"><label>落款</label><input id="author" value="制表 / @九隐"></div>
    </div>
    <div class="row">
      <div class="form-group" style="flex:1"><label>列数</label>
        <select id="cols"><option value="1">1列</option><option value="2" selected>2列</option><option value="3">3列</option></select>
      </div>
      <div class="form-group" style="flex:1"><label>主题</label>
        <select id="theme"><option value="warm">暖沙</option><option value="dark">暗黑</option><option value="paper">宣纸</option><option value="mint">冷调</option></select>
      </div>
    </div>

    <div class="form-group">
      <label>每日题目</label>
      <div id="days-box"></div>
      <button class="btn btn-sub" onclick="addDay()">➕ 新增一天</button>
    </div>

    <div class="form-group">
      <label>自定义 CSS (可选)</label>
      <textarea id="css-in" rows="3" placeholder="#card { ... } .card-item { ... }"></textarea>
    </div>

    <button class="btn btn-primary" onclick="exportPNG()">导出高清 PNG</button>
  </div>

  <!-- 卡片预览区 -->
  <div>
    <div id="card" class="theme-warm">
      <div class="card-head">
        <div id="v-title" class="card-title"></div>
        <div id="v-sub" class="card-sub"></div>
      </div>
      <div id="v-grid" class="card-grid"></div>
      <div class="card-foot">
        <span>CHALLENGE ACCEPTED</span>
        <span id="v-author"></span>
      </div>
    </div>
  </div>

  <script>
    let list = [
      "经典世界观 Paro（身份与气场）", "命运岔路 If 线（选择与代价）",
      "核心意象与氛围（自然与情绪）", "局部镜头特写（细节与留白）",
      "无声的张力对戏（潜台词与暗流）", "异色与反差侧面（隐藏的悖论）",
      "完全自由的摸鱼（本能与风格）"
    ];

    const $ = id => document.getElementById(id);

    function renderInputs() {
      $('days-box').innerHTML = list.map((text, i) => `
        <div class="day-item">
          <span class="day-tag">Day ${i+1}</span>
          <input value="${text.replace(/"/g, '&quot;')}" oninput="list[${i}]=this.value;updateCard()">
          <button class="del-btn" onclick="delDay(${i})">✕</button>
        </div>
      `).join('');
    }

    function addDay() {
      list.push(`Day ${list.length + 1} 题目`);
      renderInputs();
      updateCard();
    }

    function delDay(i) {
      if (list.length <= 1) return;
      list.splice(i, 1);
      renderInputs();
      updateCard();
    }

    function updateCard() {
      $('v-title').innerText =$('title').value || '创作挑战';
      $('v-sub').innerText =$('subtitle').value;
      $('v-author').innerText =$('author').value;
      $('custom-css').innerHTML =$('css-in').value;

      $('card').className = `theme-${$('theme').value}`;
      
      const cols = parseInt($('cols').value);$('v-grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      
      $('v-grid').innerHTML = list.map((item, i) => `
        <div class="card-item">
          <div class="card-item-tag">DAY ${i+1}</div>
          <div>${item || '待输入'}</div>
        </div>
      `).join('');
    }

    function exportPNG() {
      html2canvas($('card'), { scale: 2.5 }).then(canvas => {
        const a = document.createElement('a');
        a.download = `${$('title').value}.png`;
        a.href = canvas.toDataURL();
        a.click();
      });
    }

    ['title','subtitle','author','cols','theme','css-in'].forEach(id => $(id).oninput = updateCard);

    renderInputs();
    updateCard();
  </script>
</body>
</html>
